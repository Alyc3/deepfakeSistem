# CertiFace backend en una VM de Oracle Cloud.
#
#   api   → la imagen de backend/Dockerfile (Redis + worker Celery + FastAPI).
#   caddy → HTTPS automático (Let's Encrypt) delante de la API, en 80/443.
#
# Lo levanta deploy/oracle/setup.sh; para operarlo a mano, desde backend/:
#   sudo docker compose -f deploy/oracle/docker-compose.yml logs -f api
services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: certiface-api
    restart: unless-stopped
    # Mismo .env que en local (no entra en la imagen: ver .dockerignore).
    env_file: ../../.env
    environment:
      PORT: "8000"
      OMP_NUM_THREADS: "${THREADS:-4}"
      MKL_NUM_THREADS: "${THREADS:-4}"
    volumes:
      # Clave privada de firma de manifiestos (FORENSIC_SIGNING_KEY_PATH=./.secrets/...).
      - ../../.secrets:/home/user/app/.secrets:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 300s   # la carga de los modelos tarda 1-3 min
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Falta DOMAIN en deploy/oracle/.env (lo escribe setup.sh)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados: se conservan entre reinicios
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
