# CI/CD del backend de CertiFace.
#
#   Pruebas     → en cada push a main/develop y en cada pull request que toque backend/.
#   Despliegue  → solo en push a main (o a mano): copia backend/ a la VM de Oracle
#                 Cloud por SSH, reconstruye la imagen y comprueba la API pública.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   ORACLE_HOST         IP pública de la VM (157.151.202.23)
#   ORACLE_USER         usuario SSH (ubuntu)
#   ORACLE_SSH_KEY      clave privada de despliegue (su .pub está en ~/.ssh/authorized_keys de la VM)
#   ORACLE_KNOWN_HOSTS  opcional: huella de la VM (`ssh-keyscan <ip>`); si falta se obtiene al conectar
# Variables opcionales: BACKEND_URL (URL pública) y ORACLE_APP_DIR (carpeta del backend en la VM).
name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://157-151-202-23.sslip.io' }}

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Las pruebas no cargan los modelos: se omiten PyTorch y compañía (~2 GB).
      - name: Instalar dependencias
        run: |
          grep -vE '^(torch|torchvision|efficientnet-pytorch|timm|transformers|peft|opencv-python-headless)$' \
            requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt"

      # Valores ficticios: las pruebas no se conectan a PostgreSQL, R2 ni al auth-service.
      - name: Ejecutar pruebas
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SERVICE_URL: https://auth.example.test
          S3_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
          S3_BUCKET_NAME: certiface-ci
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          CLOUDFLARE_ACCOUNT_ID: ci
          ROLE_PERMISSIONS: '{"ADMINISTRADOR":["laboratory","users","roles"],"PERITO":["laboratory"]}'
        run: python -m unittest -v tests/test_*.py

  deploy:
    name: Desplegar en Oracle Cloud
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Un despliegue a la vez; uno nuevo espera a que termine el anterior.
    concurrency:
      group: oracle-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.BACKEND_URL || 'https://157-151-202-23.sslip.io' }}
    env:
      APP_DIR: ${{ vars.ORACLE_APP_DIR || '/home/ubuntu/certiface' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          [ -n "$HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ] \
            || { echo "::error::Faltan los secretos ORACLE_HOST, ORACLE_USER u ORACLE_SSH_KEY."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 20 -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host oracle
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          ssh oracle 'echo "Conectado a $(hostname)"'

      # --delete deja la VM igual que el repositorio, salvo lo excluido: secretos,
      # configuración local y datos que solo existen en la VM.
      - name: Copiar el código a la VM
        run: |
          ssh oracle 'command -v rsync >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rsync; }'
          rsync -az --delete --itemize-changes \
            --exclude='.env' \
            --exclude='.secrets/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='uploads/' \
            --exclude='storage_evidence/' \
            --exclude='logs/' \
            --exclude='.runtime-tmp/' \
            --exclude='calibracion/' \
            --exclude='Catologo de videos/' \
            --exclude='models/Detector_De_Face_Swap.pth' \
            --exclude='models/Detector_De_Difusion_Facial/model.safetensors' \
            --exclude='models/Sonda_De_Escena_Generada/weights.pth' \
            backend/ "oracle:$APP_DIR/"

      - name: Reconstruir y reiniciar
        run: ssh oracle "cd '$APP_DIR' && bash deploy/oracle/deploy.sh"

      - name: Verificar la API pública
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 "$BACKEND_URL/health/live"; then
              echo
              curl -fsS --max-time 15 -o /dev/null -w "Documentación (ReDoc): %{http_code}\n" "$BACKEND_URL/docs"
              echo "Desplegado: $BACKEND_URL (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $attempt: la API aún no responde; reintento en 10 s"
            sleep 10
          done
          echo "::error::La API pública no respondió en $BACKEND_URL/health/live"
          exit 1

      - name: Borrar la clave del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
